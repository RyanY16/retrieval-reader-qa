:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

h3,

}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);

}

b,
strong,
th {

}

.table-responsive {

  overflow-x: auto;

  color: var(--foreground);
  font: inherit;

.table :is(th, td) {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

.table thead th {

}

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;

  color: var(--accent-foreground);
  background: var(--accent);

.text-muted {

}

.sr-only {

  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,

}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

}

.btn:is(.btn-block, .viz-tile) {

}

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  background: transparent;

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {

}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {

  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);

.form-select:focus-visible {

  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {

  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);

    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),

  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  display: block;

  height: 28px;

  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {

.form-range::-moz-range-track {
  height: 28px;

}

  width: 20px;

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

&lt;body&gt;
&lt;div id=&quot;qa-reader-results&quot; class=&quot;qa-results-vis&quot;&gt;
  &lt;style&gt;

  &lt;div class=&quot;vis-wrap&quot;&gt;

      &lt;svg id=&quot;qa-overall-chart&quot; viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;qa-overall-title qa-overall-desc&quot;&gt;
        &lt;title id=&quot;qa-overall-title&quot;&gt;Overall F1 and exact match by training subset&lt;/title&gt;
        &lt;desc id=&quot;qa-overall-desc&quot;&gt;Grouped bars compare BERT baseline and attention-augmented BERT across 1%, 5%, and 10% SQuAD v2 training subsets.&lt;/desc&gt;

    &lt;/div&gt;

    &lt;div class=&quot;chart-block&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;chart-heading&quot;&gt;Answerable Questions Only&lt;/div&gt;
        &lt;div class=&quot;chart-subtitle text-small&quot;&gt;The added attention layer is strongest on answerable F1 at 5%, but not at 10%.&lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;qa-answerable-chart&quot; viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-labelledby=&quot;qa-answerable-title qa-answerable-desc&quot;&gt;
        &lt;title id=&quot;qa-answerable-title&quot;&gt;Answerable F1 by training subset&lt;/title&gt;
        &lt;desc id=&quot;qa-answerable-desc&quot;&gt;Grouped bars show answerable F1 for baseline and attention readers.&lt;/desc&gt;
      &lt;/svg&gt;
    &lt;/div&gt;

    &lt;div class=&quot;chart-block&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;chart-heading&quot;&gt;No-Answer Accuracy&lt;/div&gt;
        &lt;div class=&quot;chart-subtitle text-small&quot;&gt;Attention trades some abstention accuracy at 1% and 5%, but is better at 10%.&lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;qa-noanswer-chart&quot; viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-labelledby=&quot;qa-noanswer-title qa-noanswer-desc&quot;&gt;
        &lt;title id=&quot;qa-noanswer-title&quot;&gt;No-answer accuracy by training subset&lt;/title&gt;

      &lt;/svg&gt;

  &lt;script&gt;
    (function () {
      const root = document.getElementById(&quot;qa-reader-results&quot;);
      if (!root) return;

      const data = [
        {
          subset: &quot;1%&quot;,
          baseline: { em: 0.29, f1: 0.299, answerableF1: 0.1053, noAnswer: 0.88 },
          attention: { em: 0.30, f1: 0.3119, answerableF1: 0.1358, noAnswer: 0.84 }
        },
        {
          subset: &quot;5%&quot;,
          baseline: { em: 0.39, f1: 0.4067, answerableF1: 0.2889, noAnswer: 0.76 },
          attention: { em: 0.39, f1: 0.4180, answerableF1: 0.3840, noAnswer: 0.52 }
        },
        {
          subset: &quot;10%&quot;,
          baseline: { em: 0.42, f1: 0.4552, answerableF1: 0.3936, noAnswer: 0.64 },
          attention: { em: 0.41, f1: 0.4313, answerableF1: 0.3351, noAnswer: 0.72 }
        }
      ];

      function clear(svg) {
        while (svg.lastChild &amp;&amp; ![&quot;title&quot;, &quot;desc&quot;].includes(svg.lastChild.tagName)) {
          svg.removeChild(svg.lastChild);
        }
      }

      function el(name, attrs = {}) {
        const node = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, name);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        return node;
      }

      function addText(group, text, x, y, cls, anchor = &quot;middle&quot;) {
        const node = el(&quot;text&quot;, { x, y, class: cls, &quot;text-anchor&quot;: anchor });
        node.textContent = text;
        group.appendChild(node);
        return node;
      }

      function fmt(value) {
        return value.toFixed(3).replace(/0$/, &quot;&quot;);
      }

      function drawGroupedMetric(svgId, metrics, options) {
        const svg = root.querySelector(svgId);
        if (!svg) return;
        clear(svg);

        const width = 760;
        const height = options.height;
        const margin = { top: 22, right: 24, bottom: 54, left: 48 };
        const plotW = width - margin.left - margin.right;
        const plotH = height - margin.top - margin.bottom;
        const maxY = options.maxY || 1;
        const groupW = plotW / data.length;
        const metricW = groupW / metrics.length;
        const barW = Math.min(28, metricW / 3.1);

        const g = el(&quot;g&quot;, { transform: `translate(${margin.left},${margin.top})` });
        svg.appendChild(g);

        [0, 0.25, 0.5, 0.75, 1].forEach((tick) =&gt; {
          if (tick &gt; maxY) return;
          const y = plotH - (tick / maxY) * plotH;
          g.appendChild(el(&quot;line&quot;, { x1: 0, x2: plotW, y1: y, y2: y, class: &quot;grid&quot; }));
          addText(g, tick.toFixed(2), -10, y + 4, &quot;tick-label&quot;, &quot;end&quot;);
        });
        g.appendChild(el(&quot;line&quot;, { x1: 0, x2: plotW, y1: plotH, y2: plotH, class: &quot;axis&quot; }));
        g.appendChild(el(&quot;line&quot;, { x1: 0, x2: 0, y1: 0, y2: plotH, class: &quot;axis&quot; }));

        data.forEach((row, i) =&gt; {
          const groupX = i * groupW;
          addText(g, row.subset, groupX + groupW / 2, plotH + 36, &quot;axis-label&quot;);

          metrics.forEach((metric, j) =&gt; {
            const cx = groupX + j * metricW + metricW / 2;
            const bVal = row.baseline[metric.key];
            const aVal = row.attention[metric.key];
            const bH = (bVal / maxY) * plotH;
            const aH = (aVal / maxY) * plotH;
            const bX = cx - barW - 2;
            const aX = cx + 2;
            const bY = plotH - bH;
            const aY = plotH - aH;

            g.appendChild(el(&quot;rect&quot;, { x: bX, y: bY, width: barW, height: bH, rx: 3, class: &quot;baseline-bar&quot; }));
            g.appendChild(el(&quot;rect&quot;, { x: aX, y: aY, width: barW, height: aH, rx: 3, class: &quot;attention-bar&quot; }));
            addText(g, fmt(bVal), bX + barW / 2, bY - 6, &quot;value-label&quot;);
            addText(g, fmt(aVal), aX + barW / 2, aY - 6, &quot;value-label&quot;);
            addText(g, metric.label, cx, plotH + 17, &quot;axis-label&quot;);
          });
        });
      }

      function drawDeltaChart(svgId, metricKey, options) {
        const svg = root.querySelector(svgId);
        if (!svg) return;
        clear(svg);

        const width = 760;
        const height = options.height;
        const margin = { top: 18, right: 24, bottom: 45, left: 48 };
        const plotW = width - margin.left - margin.right;
        const plotH = height - margin.top - margin.bottom;
        const maxY = 1;
        const groupW = plotW / data.length;
        const barW = Math.min(56, groupW / 4.2);

        const g = el(&quot;g&quot;, { transform: `translate(${margin.left},${margin.top})` });
        svg.appendChild(g);

        [0, 0.25, 0.5, 0.75, 1].forEach((tick) =&gt; {
          const y = plotH - (tick / maxY) * plotH;
          g.appendChild(el(&quot;line&quot;, { x1: 0, x2: plotW, y1: y, y2: y, class: &quot;grid&quot; }));
          addText(g, tick.toFixed(2), -10, y + 4, &quot;tick-label&quot;, &quot;end&quot;);
        });
        g.appendChild(el(&quot;line&quot;, { x1: 0, x2: plotW, y1: plotH, y2: plotH, class: &quot;axis&quot; }));
        g.appendChild(el(&quot;line&quot;, { x1: 0, x2: 0, y1: 0, y2: plotH, class: &quot;axis&quot; }));

        data.forEach((row, i) =&gt; {
          const cx = i * groupW + groupW / 2;
          const bVal = row.baseline[metricKey];
          const aVal = row.attention[metricKey];
          const bH = bVal * plotH;
          const aH = aVal * plotH;
          const bX = cx - barW - 4;
          const aX = cx + 4;
          const bY = plotH - bH;
          const aY = plotH - aH;
          const delta = aVal - bVal;

          g.appendChild(el(&quot;rect&quot;, { x: bX, y: bY, width: barW, height: bH, rx: 3, class: &quot;baseline-bar&quot; }));
          g.appendChild(el(&quot;rect&quot;, { x: aX, y: aY, width: barW, height: aH, rx: 3, class: &quot;attention-bar&quot; }));
          addText(g, fmt(bVal), bX + barW / 2, bY - 6, &quot;value-label&quot;);
          addText(g, fmt(aVal), aX + barW / 2, aY - 6, &quot;value-label&quot;);
          addText(g, row.subset, cx, plotH + 28, &quot;axis-label&quot;);
          addText(g, `${delta &gt;= 0 ? &quot;+&quot; : &quot;&quot;}${fmt(delta)}`, cx, Math.min(bY, aY) - 24, delta &gt;= 0 ? &quot;delta-positive&quot; : &quot;delta-negative&quot;);
        });
      }

      drawGroupedMetric(&quot;#qa-overall-chart&quot;, [
        { key: &quot;f1&quot;, label: &quot;F1&quot; },
        { key: &quot;em&quot;, label: &quot;EM&quot; }
      ], { height: 330, maxY: 0.5 });

      drawDeltaChart(&quot;#qa-answerable-chart&quot;, &quot;answerableF1&quot;, { height: 250 });
      drawDeltaChart(&quot;#qa-noanswer-chart&quot;, &quot;noAnswer&quot;, { height: 250 });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

      .then(({ x, y }) =&gt; {

        }
        const scale = window.devicePixelRatio || 1;

    const trigger = getTrigger(event.target);

    const trigger = getTrigger(event.target);

    const trigger = getTrigger(event.target);

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
